<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — Threadline</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Threadline</a>
      <nav class="main-nav" aria-label="Основная навигация">
        <a href="index.html" class="nav-link">Главная</a>
        <a href="/catalog" class="nav-link">Каталог</a>
        <a href="register.html" class="nav-link active">Регистрация</a>
        <a href="login.html" class="nav-link">Вход</a>
      </nav>
    </div>
  </header>

  <main class="container auth-page">
    <section class="auth-card">
      <h1>Регистрация</h1>
      <p class="auth-subtitle">Создайте аккаунт, чтобы отслеживать заказы и получать скидки.</p>

      <form id="register-form" class="auth-form" novalidate>
        <div class="form-field">
          <label for="fullname">ФИО</label>
          <input type="text" id="fullname" name="fullname" placeholder="Иванов Иван Иванович" />
          <span class="error-message" data-error-for="fullname"></span>
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" />
          <span class="error-message" data-error-for="email"></span>
        </div>

        <div class="form-field">
          <label for="login">Логин</label>
          <input type="text" id="login" name="login" placeholder="threadline_user" />
          <span class="error-message" data-error-for="login"></span>
        </div>

        <div class="form-field">
          <label for="password">Пароль</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="Минимум 8 символов" />
            <button type="button" class="toggle-password" data-target="password" aria-label="Показать пароль">👁</button>
          </div>
          <span class="error-message" data-error-for="password"></span>
        </div>

        <div class="form-field">
          <label for="confirm-password">Повтор пароля</label>
          <div class="password-wrap">
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Повторите пароль" />
            <button type="button" class="toggle-password" data-target="confirm-password" aria-label="Показать пароль">👁</button>
          </div>
          <span class="error-message" data-error-for="confirm-password"></span>
        </div>

        <p id="form-success" class="form-success" role="status"></p>

        <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>
        <p class="auth-switch">Уже есть аккаунт? <a href="login.html">Войти</a></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Threadline.</p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
