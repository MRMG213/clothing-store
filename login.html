<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Threadline</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Threadline</a>
      <nav class="main-nav" aria-label="Основная навигация">
        <a href="index.html" class="nav-link">Главная</a>
        <a href="catalog.html" class="nav-link">Каталог</a>
        <a href="register.html" class="nav-link">Регистрация</a>
        <a href="login.html" class="nav-link active">Вход</a>
      </nav>
    </div>
  </header>

  <main class="container auth-page">
    <section class="auth-card">
      <h1>Вход</h1>
      <p class="auth-subtitle">Войдите в аккаунт, чтобы продолжить покупки.</p>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-field">
          <label for="login-email">Email или логин</label>
          <input type="text" id="login-email" name="login-email" placeholder="you@example.com" />
          <span class="error-message" data-error-for="login-email"></span>
        </div>

        <div class="form-field">
          <label for="login-password">Пароль</label>
          <div class="password-wrap">
            <input type="password" id="login-password" name="login-password" placeholder="Ваш пароль" />
            <button type="button" class="toggle-password" data-target="login-password" aria-label="Показать пароль">👁</button>
          </div>
          <span class="error-message" data-error-for="login-password"></span>
        </div>

        <p id="form-success" class="form-success" role="status"></p>

        <button type="submit" class="btn btn-primary btn-full">Войти</button>
        <p class="auth-switch">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Threadline.</p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
